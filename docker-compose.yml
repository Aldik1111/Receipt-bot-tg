services:
  bot:
    build: .
    command: python bot.py
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/budget.db
      BACKUP_DIR: /data/backups
      LOG_FILE: /data/logs/bot.log
      LOG_FORMAT: json
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--db-only"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  webapp:
    build: .
    command: python webapp_api.py
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/budget.db
      WEBAPP_HOST: 0.0.0.0
      WEBAPP_PORT: "8000"
      LOG_FILE: /data/logs/webapp.log
      LOG_FORMAT: json
    volumes:
      - sqlite-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--url", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      bot:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./webapp:/srv/webapp:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      webapp:
        condition: service_healthy

volumes:
  sqlite-data:
  caddy-data:
  caddy-config:
