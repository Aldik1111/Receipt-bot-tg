<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
    padding: 12px 16px 32px;
  }
  h1 { font-size: 18px; margin: 8px 0 16px; }
  .tabs {
    display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto;
  }
  .tab {
    padding: 6px 14px; border-radius: 16px; font-size: 13px; white-space: nowrap;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-text-color, #111);
    cursor: pointer; border: none;
  }
  .tab.active {
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
  }
  .card {
    background: var(--tg-theme-secondary-bg-color, #f7f7f7);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card-title { font-size: 13px; opacity: 0.65; margin-bottom: 6px; }
  .card-value { font-size: 22px; font-weight: 600; }
  .row { display: flex; gap: 10px; }
  .row .card { flex: 1; }
  .muted { opacity: 0.6; font-size: 12px; }
  .list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid rgba(128,128,128,0.15);
    font-size: 14px;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item .left { display: flex; flex-direction: column; }
  .list-item .cat { font-size: 12px; opacity: 0.6; }
  .bar-bg {
    background: rgba(128,128,128,0.2); border-radius: 6px; height: 8px; margin-top: 6px; overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 6px; }
  .empty { text-align: center; opacity: 0.5; padding: 24px 0; font-size: 14px; }
  canvas { max-height: 240px; }
</style>
</head>
<body>

<h1>📊 Мой бюджет</h1>

<div class="tabs">
  <button class="tab active" data-tab="overview">Обзор</button>
  <button class="tab" data-tab="transactions">Операции</button>
  <button class="tab" data-tab="budgets">Бюджеты</button>
  <button class="tab" data-tab="goals">Цели</button>
</div>

<div class="tabs" id="period-tabs">
  <button class="tab active" data-period="week">Неделя</button>
  <button class="tab" data-period="month">Месяц</button>
  <button class="tab" data-period="3months">3 месяца</button>
  <button class="tab" data-period="year">Год</button>
</div>

<div id="view-overview">
  <div class="row">
    <div class="card">
      <div class="card-title">💸 Расходы</div>
      <div class="card-value" id="expense-value">—</div>
    </div>
    <div class="card">
      <div class="card-title">💰 Доходы</div>
      <div class="card-value" id="income-value">—</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Баланс</div>
    <div class="card-value" id="balance-value">—</div>
  </div>
  <div class="card">
    <div class="card-title">По категориям</div>
    <canvas id="category-chart"></canvas>
  </div>
</div>

<div id="view-transactions" style="display:none">
  <div class="card" id="transactions-list"></div>
</div>

<div id="view-budgets" style="display:none">
  <div class="card" id="budgets-list"></div>
</div>

<div id="view-goals" style="display:none">
  <div class="card" id="goals-list"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || "";

let currentTab = "overview";
let currentPeriod = "month";
let chart = null;

async function api(path) {
  const res = await fetch(path, { headers: { "X-Telegram-Init-Data": initData } });
  if (!res.ok) throw new Error("API error " + res.status);
  return res.json();
}

function fmtPct(pct) { return Math.round(pct) + "%"; }

async function loadOverview() {
  const [summary, categories] = await Promise.all([
    api(`/api/summary?period=${currentPeriod}`),
    api(`/api/categories?period=${currentPeriod}`),
  ]);
  document.getElementById("expense-value").textContent = summary.expense_formatted;
  document.getElementById("income-value").textContent = summary.income_formatted;
  document.getElementById("balance-value").textContent = summary.balance_formatted;

  const ctx = document.getElementById("category-chart");
  const labels = categories.items.map(i => i.category);
  const data = categories.items.map(i => i.amount);
  if (chart) chart.destroy();
  if (data.length === 0) {
    ctx.getContext("2d").clearRect(0, 0, ctx.width, ctx.height);
    return;
  }
  chart = new Chart(ctx, {
    type: "doughnut",
    data: { labels, datasets: [{ data, backgroundColor: [
      "#2481cc","#4caf50","#ff9800","#e91e63","#9c27b0","#00bcd4","#ffc107","#795548","#607d8b"
    ] }] },
    options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } } },
  });
}

async function loadTransactions() {
  const data = await api("/api/transactions?limit=30");
  const el = document.getElementById("transactions-list");
  if (data.items.length === 0) {
    el.innerHTML = '<div class="empty">Пока нет операций</div>';
    return;
  }
  el.innerHTML = data.items.map(t => `
    <div class="list-item">
      <div class="left">
        <span>${t.description || t.store || "без описания"}</span>
        <span class="cat">${t.date} · ${t.category || "—"}</span>
      </div>
      <span>${t.type === "income" ? "+" : "-"}${t.amount_formatted}</span>
    </div>
  `).join("");
}

async function loadBudgets() {
  const data = await api("/api/budgets");
  const el = document.getElementById("budgets-list");
  if (data.items.length === 0) {
    el.innerHTML = '<div class="empty">Лимиты не заданы</div>';
    return;
  }
  el.innerHTML = data.items.map(b => {
    const color = b.pct >= 100 ? "#e53935" : (b.pct >= 80 ? "#fb8c00" : "#43a047");
    return `
      <div style="margin-bottom:14px">
        <div class="list-item" style="border:none;padding:2px 0">
          <span>${b.category}</span>
          <span>${b.spent_formatted} / ${b.limit_formatted}</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(b.pct,100)}%;background:${color}"></div></div>
      </div>`;
  }).join("");
}

async function loadGoals() {
  const data = await api("/api/goals");
  const el = document.getElementById("goals-list");
  if (data.items.length === 0) {
    el.innerHTML = '<div class="empty">Целей пока нет</div>';
    return;
  }
  el.innerHTML = data.items.map(g => `
    <div style="margin-bottom:14px">
      <div class="list-item" style="border:none;padding:2px 0">
        <span>${g.name}</span>
        <span>${g.current_formatted} / ${g.target_formatted}</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(g.pct,100)}%;background:var(--tg-theme-button-color,#2481cc)"></div></div>
    </div>
  `).join("");
}

async function refresh() {
  try {
    if (currentTab === "overview") await loadOverview();
    if (currentTab === "transactions") await loadTransactions();
    if (currentTab === "budgets") await loadBudgets();
    if (currentTab === "goals") await loadGoals();
  } catch (e) {
    console.error(e);
  }
}

document.querySelectorAll(".tabs")[0].addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tabs")[0].querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentTab = btn.dataset.tab;
  ["overview","transactions","budgets","goals"].forEach(t => {
    document.getElementById("view-" + t).style.display = (t === currentTab) ? "block" : "none";
  });
  document.getElementById("period-tabs").style.display = (currentTab === "overview") ? "flex" : "none";
  refresh();
});

document.getElementById("period-tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.getElementById("period-tabs").querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentPeriod = btn.dataset.period;
  refresh();
});

refresh();
</script>
</body>
</html>
