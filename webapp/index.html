<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Бюджет</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://telegram.org https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; form-action 'none';">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt" crossorigin="anonymous"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
    padding: 12px 16px 32px;
  }
  h1 { font-size: 18px; margin: 8px 0 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .tab {
    padding: 6px 14px; border-radius: 16px; font-size: 13px; white-space: nowrap;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-text-color, #111);
    cursor: pointer; border: none; flex-shrink: 0;
  }
  .tab.active {
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
  }
  select.tab { -webkit-appearance: none; appearance: none; font-family: inherit; }
  .card {
    background: var(--tg-theme-secondary-bg-color, #f7f7f7);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
  }
  .card-title { font-size: 13px; opacity: 0.65; margin-bottom: 6px; }
  .card-value { font-size: 22px; font-weight: 600; }
  .row { display: flex; gap: 10px; }
  .row .card { flex: 1; }
  .list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid rgba(128,128,128,0.15);
    font-size: 14px;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item .left { display: flex; flex-direction: column; gap: 2px; }
  .list-item .cat { font-size: 12px; opacity: 0.6; }
  .bar-bg { background: rgba(128,128,128,0.2); border-radius: 6px; height: 8px; margin-top: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; }
  .empty { text-align: center; opacity: 0.5; padding: 24px 0; font-size: 14px; }
  canvas { max-height: 220px; }
  .section-title { font-size: 14px; font-weight: 600; margin: 18px 0 8px; }
</style>
</head>
<body>

<h1>📊 Мой бюджет</h1>

<div class="tabs">
  <button class="tab active" data-tab="overview">Обзор и операции</button>
  <button class="tab" data-tab="budgets">Бюджеты</button>
  <button class="tab" data-tab="goals">Цели</button>
</div>

<div id="view-overview">
  <div class="tabs" id="period-tabs">
    <button class="tab active" data-period="week">Неделя</button>
    <button class="tab" data-period="month">Месяц</button>
    <button class="tab" data-period="3months">3 месяца</button>
    <button class="tab" data-period="year">Год</button>
  </div>
  <select id="category-filter" class="tab" style="width:100%; margin-bottom:12px; padding:8px;">
    <option value="all">Все категории</option>
  </select>

  <div class="row">
    <div class="card">
      <div class="card-title">💸 Расходы</div>
      <div class="card-value" id="expense-value">—</div>
    </div>
    <div class="card">
      <div class="card-title">💰 Доходы</div>
      <div class="card-value" id="income-value">—</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Баланс</div>
    <div class="card-value" id="balance-value">—</div>
  </div>

  <div class="card">
    <div class="card-title">По категориям</div>
    <canvas id="category-chart"></canvas>
  </div>

  <div class="section-title">Операции</div>
  <div class="card" id="transactions-list"></div>
  <div id="tx-pager" class="tabs" style="display:none;margin-top:8px">
    <button class="tab" id="tx-prev" type="button">Назад</button>
    <button class="tab" id="tx-next" type="button">Ещё</button>
  </div>
</div>
<div id="app-error" class="empty" style="display:none"></div>

<div id="view-budgets" style="display:none">
  <div class="card" id="budgets-list"></div>
</div>

<div id="view-goals" style="display:none">
  <div class="card" id="goals-list"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || "";

let currentTab = "overview";
let currentPeriod = "month";
let currentCategory = "all";
let chart = null;
let txOffset = 0;
const TX_PAGE = 50;

function setText(id, value) {
  document.getElementById(id).textContent = value == null ? "" : String(value);
}

function setEmpty(el, text) {
  el.replaceChildren();
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.textContent = text;
  el.appendChild(empty);
}

async function api(path) {
  const res = await fetch(path, { headers: { "X-Telegram-Init-Data": initData } });
  if (!res.ok) throw new Error("API error " + res.status);
  return res.json();
}

async function loadCategoryFilter() {
  const data = await api("/api/category_list");
  const select = document.getElementById("category-filter");
  select.replaceChildren();
  const all = document.createElement("option");
  all.value = "all";
  all.textContent = "Все категории";
  select.appendChild(all);
  (data.items || []).forEach(c => {
    const opt = document.createElement("option");
    opt.value = encodeURIComponent(c.name);
    opt.textContent = `${c.emoji || ""} ${c.name || ""}`.trim();
    select.appendChild(opt);
  });
}

async function loadOverview() {
  const catParam = currentCategory !== "all" ? `&category=${currentCategory}` : "";
  const [summary, categories, transactions] = await Promise.all([
    api(`/api/summary?period=${currentPeriod}`),
    api(`/api/categories?period=${currentPeriod}`),
    api(`/api/transactions?period=${currentPeriod}${catParam}&limit=${TX_PAGE}&offset=${txOffset}`),
  ]);

  setText("expense-value", summary.expense_formatted);
  setText("income-value", summary.income_formatted);
  setText("balance-value", summary.balance_formatted);

  const ctx = document.getElementById("category-chart");
  const labels = categories.items.map(i => `${i.emoji} ${i.category}`);
  const data = categories.items.map(i => i.amount);
  if (chart) chart.destroy();
  if (data.length > 0) {
    chart = new Chart(ctx, {
      type: "doughnut",
      data: { labels, datasets: [{ data, backgroundColor: [
        "#2481cc","#4caf50","#ff9800","#e91e63","#9c27b0","#00bcd4","#ffc107","#795548","#607d8b"
      ] }] },
      options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } } },
    });
  } else {
    ctx.getContext("2d").clearRect(0, 0, ctx.width, ctx.height);
  }

  const listEl = document.getElementById("transactions-list");
  if (transactions.items.length === 0) {
    setEmpty(listEl, "Операций не найдено");
  } else {
    listEl.replaceChildren();
    transactions.items.forEach(t => {
      const item = document.createElement("div");
      item.className = "list-item";
      const left = document.createElement("div");
      left.className = "left";
      const title = document.createElement("span");
      title.textContent = t.description || t.store || "без описания";
      const cat = document.createElement("span");
      cat.className = "cat";
      cat.textContent = `${t.date} · ${t.category_emoji || "🏷"} ${t.category || "—"}`;
      left.append(title, cat);
      const amount = document.createElement("span");
      amount.textContent = `${t.type === "income" ? "+" : "-"}${t.amount_formatted}`;
      item.append(left, amount);
      listEl.appendChild(item);
    });
  }
  const pager = document.getElementById("tx-pager");
  const total = Number(transactions.total) || 0;
  pager.style.display = total > TX_PAGE ? "flex" : "none";
  document.getElementById("tx-prev").disabled = txOffset <= 0;
  document.getElementById("tx-next").disabled = txOffset + TX_PAGE >= total;
}

async function loadBudgets() {
  const data = await api("/api/budgets");
  const el = document.getElementById("budgets-list");
  if (data.items.length === 0) {
    setEmpty(el, "Лимиты не заданы");
    return;
  }
  el.replaceChildren();
  data.items.forEach(b => {
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "14px";
    const row = document.createElement("div");
    row.className = "list-item";
    row.style.border = "none";
    row.style.padding = "2px 0";
    const name = document.createElement("span");
    name.textContent = b.category;
    const nums = document.createElement("span");
    nums.textContent = `${b.spent_formatted} / ${b.limit_formatted}`;
    row.append(name, nums);
    const barBg = document.createElement("div");
    barBg.className = "bar-bg";
    const barFill = document.createElement("div");
    barFill.className = "bar-fill";
    const pct = Number(b.pct);
    barFill.style.width = `${Math.min(Number.isFinite(pct) ? pct : 0, 100)}%`;
    barFill.style.background = pct >= 100 ? "#e53935" : (pct >= 80 ? "#fb8c00" : "#43a047");
    barBg.appendChild(barFill);
    wrap.append(row, barBg);
    el.appendChild(wrap);
  });
}

async function loadGoals() {
  const data = await api("/api/goals");
  const el = document.getElementById("goals-list");
  if (data.items.length === 0) {
    setEmpty(el, "Целей пока нет");
    return;
  }
  el.replaceChildren();
  data.items.forEach(g => {
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "14px";
    const row = document.createElement("div");
    row.className = "list-item";
    row.style.border = "none";
    row.style.padding = "2px 0";
    const name = document.createElement("span");
    name.textContent = g.name;
    const nums = document.createElement("span");
    nums.textContent = `${g.current_formatted} / ${g.target_formatted}`;
    row.append(name, nums);
    const barBg = document.createElement("div");
    barBg.className = "bar-bg";
    const barFill = document.createElement("div");
    barFill.className = "bar-fill";
    const pct = Number(g.pct);
    barFill.style.width = `${Math.min(Number.isFinite(pct) ? pct : 0, 100)}%`;
    barFill.style.background = "var(--tg-theme-button-color,#2481cc)";
    barBg.appendChild(barFill);
    wrap.append(row, barBg);
    el.appendChild(wrap);
  });
}

async function refresh() {
  const err = document.getElementById("app-error");
  err.style.display = "none";
  try {
    if (currentTab === "overview") await loadOverview();
    if (currentTab === "budgets") await loadBudgets();
    if (currentTab === "goals") await loadGoals();
  } catch (e) {
    console.error(e);
    err.style.display = "block";
    err.textContent = "Не удалось загрузить данные. Открой Mini App из бота после /start.";
  }
}

document.querySelectorAll(".tabs")[0].addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tabs")[0].querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentTab = btn.dataset.tab;
  ["overview","budgets","goals"].forEach(t => {
    document.getElementById("view-" + t).style.display = (t === currentTab) ? "block" : "none";
  });
  refresh();
});

document.getElementById("period-tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.getElementById("period-tabs").querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentPeriod = btn.dataset.period;
  txOffset = 0;
  refresh();
});

document.getElementById("category-filter").addEventListener("change", (e) => {
  currentCategory = e.target.value;
  txOffset = 0;
  refresh();
});

document.getElementById("tx-prev").addEventListener("click", () => {
  txOffset = Math.max(0, txOffset - TX_PAGE);
  refresh();
});
document.getElementById("tx-next").addEventListener("click", () => {
  txOffset += TX_PAGE;
  refresh();
});

loadCategoryFilter();
refresh();
</script>
</body>
</html>
